    <main>

    <section>
        <h2>Student Registration</h2>

        <p>
            Complete the form below to register your interest in joining
            The Modeling Academy.
        </p>

        <form>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>

            <br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>

            <br><br>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="16" required>

            <br><br>

            <label for="course">Select Course:</label>

            <select id="course" name="course">
                <option value="runway">Runway Modeling</option>
                <option value="posing">Posing and Photography</option>
                <option value="presentation">Personal Presentation</option>
                <option value="professional">Professional Modeling</option>
            </select>

            <br><br>

            <label for="experience">Previous Modeling Experience:</label>

            <br>

            <textarea id="experience"
                      name="experience"
                      rows="5"
                      cols="40"></textarea>

            <br><br>

            <button type="submit">Submit Registration</button>

        </form>
    </section>

</main>
